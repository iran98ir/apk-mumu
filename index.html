    position: relative;سلام! بسیار عالی. برای اپلیکیشن **کاردار (Kardar)**، من یک طراحی مدرن، سنگین و حرفه‌ای (Corporate/Utility Style) آماده کردم.

برخلاف «مومو» که تم صورتی و فانتزی داشت، اینجا از ترکیب رنگ‌های **آبی لاجوردی (Royal Blue)**، **سرمه‌ای تیره** و **سفید یخی** استفاده کردم تا حس اعتماد، مدیریت و کارایی را منتقل کند. همچنین فونت‌ها و چیدمان متناسب با نام فارسی تنظیم شده‌اند.

این کد را به عنوان فایل جدید (مثلاً `kardar.html`) در مخزن گیت‌هاب خود ذخیره کنید:

```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kardar — Download</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<!-- فونت وزیرمتن برای ظاهر رسمی و خوانا -->
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }

  body {
    font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
    background:#0f172a; /* سرمه‌ای خیلی تیره */
    color:#ffffff;
    min-height:100dvh;
    overflow-x:hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* هدر بصری با تم آبی/مدیریتی */
  .hero-visual {
    position: relative;
    width:100%;
    height: 44vh;
    min-height: 300px;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .hero-visual::before {
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.4), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(147, 51, 234, 0.3), transparent 50%),
      linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
  }
  /* پترن شبکه‌ای ریز برای حس تکنولوژی */
  .hero-visual::after {
    content:'';
    position:absolute; inset:0;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    opacity: 0.4;
  }

  .hero-icon {
    position: relative;
    z-index:2;
    width: 130px; height: 130px;
    border-radius: 32px; /* کمی مربعی‌تر برای حس جدیت */
    display: block;
    object-fit: cover;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow:
      0 25px 50px -12px rgba(0,0,0,0.6),
      0 0 60px -15px rgba(59, 130, 246, 0.6); /* سایه آبی */
    animation: float 5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(1deg); }
  }

  .content {
    position: relative;
    z-index: 3;
    max-width: 480px;
    margin: -50px auto 0;
    padding: 0 20px;
  }

  .card {
    background: rgba(30, 41, 59, 0.7); /* شیشه‌ای تیره */
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-top: 1px solid rgba(255,255,255,0.2);
    border-radius: 32px;
    padding: 36px 24px 30px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.9);
    text-align:center;
    animation: rise 0.7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise {
    from { opacity:0; transform: translateY(30px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .badge {
    display: inline-flex; align-items:center; gap:8px;
    background: rgba(59, 130, 246, 0.15); /* آبی ملایم */
    border: 1px solid rgba(59, 130, 246, 0.3);
    color:#93c5fd;
    font-size: 12px; font-weight: 700;
    padding: 6px 14px;
    border-radius: 99px;
    margin-bottom: 20px;
  }
  .badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background:#3b82f6;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.8); }
  }

  h1 {
    font-family: 'Vazirmatn', sans-serif;
    font-size: 44px;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1.2;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #ffffff 0%, #bfdbfe 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .tagline {
    font-size: 15px;
    color:#cbd5e1;
    font-weight: 500;
    line-height: 1.7;
    margin-bottom: 28px;
    opacity: 0.9;
  }

  .stats-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 10px;
    background: rgba(0,0,0,0.2);
    border-radius: 16px;
    margin-bottom: 24px;
  }
  .stat-mini { 
    flex: 1; 
    text-align:center; 
    position: relative;
  }
  .stat-mini:not(:last-child)::after {
    content:''; position:absolute; left:0; top:20%; height:60%; width:1px;
    background: rgba(255,255,255,0.1);
  }
  .stat-mini .val {
    font-size: 17px; font-weight: 800;
    color:#fff;
    margin-bottom: 4px;
    display: block;
    direction: ltr; /* اعداد انگلیسی نمایش داده شوند */
  }
  .stat-mini .lbl {
    font-size: 11px; color:#94a3b8;
    font-weight: 600;
  }

  .sec-line {
    display:flex; align-items:flex-start; gap:12px;
    padding: 14px;
    background: rgba(16, 185, 129, 0.08); /* سبز امنیتی */
    border: 1px solid rgba(16, 185, 129, 0.2);
    border-radius: 16px;
    margin-bottom: 24px;
    text-align:right;
  }
  .sec-line .shield-ic {
    flex-shrink:0;
    width: 28px; height: 28px;
    border-radius: 8px;
    background: rgba(16, 185, 129, 0.2);
    display:flex; align-items:center; justify-content:center;
    color: #34d399;
  }
  .sec-line p {
    font-size: 12.5px;
    color:#a7f3d0;
    line-height: 1.6;
    font-weight: 500;
    margin-top: 2px;
  }
  .sec-line b { color:#6ee7b7; font-weight: 800; }

  /* دکمه اصلی دانلود */
  .btn-inline {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width: 100%;
    padding: 16px 20px;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); /* آبی پررنگ */
    color:#fff;
    text-decoration:none;
    border-radius: 16px;
    font-size: 16px; font-weight: 800;
    letter-spacing: 0.5px;
    box-shadow:
      0 10px 25px -5px rgba(37, 99, 235, 0.6),
      inset 0 1px 0 rgba(255,255,255,0.2);
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .btn-inline:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.7);
  }
  .btn-inline:active { transform: scale(0.98); }
  .btn-inline svg { width:20px; height:20px; }

  .version-info {
    margin-top: 16px;
    font-size: 12px; color:#64748b;
    font-weight: 600;
  }
  .version-info span { color:#93c5fd; font-weight: 700; }

  .footer {
    text-align: center;
    margin-top: 24px;
    padding-bottom: 10px;
    font-size: 11px;
    color:#475569;
    font-weight: 600;
  }
  .footer .trust-badge {
    display: inline-flex; align-items: center; gap:6px;
    color: #94a3b8;
    background: rgba(255,255,255,0.03);
    padding: 6px 12px;
    border-radius: 20px;
  }

  @media (max-height: 700px) {
    .hero-visual { height: 35vh; }
    .hero-icon { width: 100px; height: 100px; }
    .card { padding: 24px 18px 20px; }
    h1 { font-size: 38px; }
  }
</style>
</head>
<body>

  <div class="hero-visual">
    <!-- آیکون برنامه -->
    <img src="icon.png" alt="Kardar App" class="hero-icon" id="appIcon">
  </div>

  <div class="content">
    <div class="card">

      <div class="badge">
        <span class="dot"></span>
        آخرین نسخه منتشر شده
      </div>

      <h1>کاردار</h1>
      <p class="tagline">دستیار هوشمند شما برای مدیریت سریع و دقیق امور روزانه</p>

      <div class="stats-row">
        <div class="stat-mini">
          <span class="val">6.09.02</span>
          <span class="lbl">نسخه</span>
        </div>
        <div class="stat-mini">
          <span class="val">Stable</span>
          <span class="lbl">وضعیت</span>
        </div>
        <div class="stat-mini">
          <span class="val">Free</span>
          <span class="lbl">قیمت</span>
        </div>
      </div>

      <div class="sec-line">
        <div class="shield-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <p><b>امنیت تضمین شده.</b> این نرم‌افزار بدون دسترسی‌های غیرضروری و کاملاً ایمن طراحی شده است.</p>
      </div>

      <!-- لینک دانلود -->
      <a href="#"
         class="btn-inline" id="downloadBtn" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        نصب و راه‌اندازی
      </a>

      <div class="version-info">
        شناسه نسخه: <span>v6.09.02</span>
      </div>

    </div>

    <div class="footer">
      <div class="trust-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        تایید شده توسط Rayan App
      </div>
    </div>
  </div>

  <script>
    // اسکریپت هوشمند برای دریافت لینک مستقیم APK از گیت‌هاب
    (function(){
      var btn = document.getElementById('downloadBtn');
      
      // توجه: چون ریپازیتوری یکی است، آخرین فایل APK ریپازیتوری را پیدا می‌کند.
      // اگر فایل دیگری آپلود کنید، آن را دانلود می‌کند.
      var repo = 'iran98ir/apk-mumu'; 
      var fallback = 'https://github.com/' + repo + '/releases/latest';

      fetch('https://api.github.com/repos/' + repo + '/releases/latest', {
        headers: { 'Accept': 'application/vnd.github+json' }
      })
      .then(function(r){
        if (!r.ok) throw new Error('API Error');
        return r.json();
      })
      .then(function(data){
        var assets = data.assets || [];
        // پیدا کردن فایل با پسوند apk
        var apk = assets.find(function(a){ return /\.apk$/i.test(a.name); });
        
        if(apk) {
            btn.href = apk.browser_download_url;
            console.log("Download link found: " + apk.name);
        } else {
            btn.href = fallback;
        }
      })
      .catch(function(err){
        console.error(err);
        btn.href = fallback;
      });

      // جایگزینی تصویر در صورت لود نشدن icon.png
      var img = document.getElementById('appIcon');
      img.onerror = function(){
        img.outerHTML = '<svg class="hero-icon" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" style="background:#1e293b;padding:20px">' +
          '<defs><linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient></defs>' +
          '<rect width="1000" height="1000" rx="200" fill="url(#grad1)"/>' +
          '<text x="500" y="550" text-anchor="middle" font-family="Tahoma, Arial" font-weight="bold" font-size="250" fill="#ffffff">K</text>' +
          '</svg>';
      };
    })();
  </script>
</body>
</html>
